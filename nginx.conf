events {
    worker_connections 1024;
}

http {
    # Resolve the internal Docker Compose DNS name
    upstream api_nodes {
        # 'api' is the service name in docker-compose.yml
        # Docker handles round-robin routing internally
        server api:5000;
        
        # Required for Socket.IO multi-node sticky sessions if you bypass Redis
        # ip_hash; 
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Required to support WebSockets (Socket.IO)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
